tag_plugins:
  note:
    default_color: ''
    border: true
  checkbox:
    interactive: false
  quot:
    default:
      prefix: bxs:quote-left
      suffix: bxs:quote-right
    hashtag:
      prefix: solar:hashtag-square-bold
    question:
      prefix: ph:seal-question-fill
  emoji:
    default: https://jsd.dusays.com/gh/cdn-x/emoticons@3.1/qq/{name}.gif
    twemoji: https://jsd.dusays.com/gh/twitter/twemoji/assets/svg/{name}.svg
    qq: https://jsd.dusays.com/gh/cdn-x/emoticons@3.1/qq/{name}.gif
    aru: https://jsd.dusays.com/gh/cdn-x/emoticons@3.1/aru/{name}.gif
    tieba: https://jsd.dusays.com/gh/cdn-x/emoticons@3.1/tieba/{name}.png
    blobcat: https://jsd.dusays.com/gh/cdn-x/emoticons@3.1/blobcat/{name}.gif
  icon:
    default_color: accent
  button:
    default_color: theme
  image:
    parse_markdown: false
  copy:
    toast: 复制成功
  timeline:
    max-height: 80vh
  mark:
    default_color: yellow
  hashtag:
    default_color:
  okr:
    border: true
    status:
      in_track:
        color: blue
        label: 正常
      at_risk:
        color: yellow
        label: 风险
      off_track:
        color: orange
        label: 延期
      finished:
        color: green
        label: 已完成
      unfinished:
        color: red
        label: 未完成
  gallery:
    layout: grid
    size: mix
    ratio: square
  chat:
    api: https://siteinfo.listentothewind.cn/api/v1
dependencies:
  marked: https://jsd.dusays.com/npm/marked@18.0/lib/marked.umd.min.js
  lazyload:
    js: https://jsd.dusays.com/npm/vanilla-lazyload@19.1/dist/lazyload.min.js
    transition: fade
    fix_ratio: true
plugins:
  preload:
    enable: true
    service: flying_pages
    flying_pages: https://jsd.dusays.com/npm/flying-pages@2/flying-pages.min.js
  fancybox:
    enable: true
    mode: auto
    js: https://jsd.dusays.com/npm/@fancyapps/ui@6.1/dist/fancybox/fancybox.umd.js
    css: https://jsd.dusays.com/npm/@fancyapps/ui@6.1/dist/fancybox/fancybox.css
    selector: .timenode p>img
  swiper:
    enable: true
    css: https://jsd.dusays.com/npm/swiper@14.0/swiper-bundle.min.css
    js: https://jsd.dusays.com/npm/swiper@14.0/swiper-bundle.min.js
  scrollreveal:
    enable: true
    js: https://jsd.dusays.com/npm/scrollreveal@4.0/dist/scrollreveal.min.js
    distance: 8px
    duration: 1000
    interval: 100
    scale: 1
  tianli_gpt:
    enable:
    js: https://jsd.dusays.com/gh/qxchuckle/Post-Summary-AI@6.0/chuckle-post-ai.min.js
    field: post
    key: 5Q5mpqRK5DkwT1X9Gi5e
    total_length: 1000
    typewriter: true
    summary_directly: true
    rec_method: all
    hide_shuttle: true
    summary_toggle: false
    interface:
      name: AI摘要
      introduce: '我是文章辅助AI: QX-AI，点击下方的按钮，让我生成本文简介、推荐相关文章等。'
      version: TianliGPT
      button: ["介绍自己", "推荐文章", "生成摘要", "矩阵穿梭"]
  katex:
    enable:
    inject: |
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.23/dist/katex.min.css" integrity="sha384-//SZkxyB7axjCAopkAL1E1rve+ZSPKapD89Lo/lLhcsXR+zOYl5z6zJZEFXil+q0" crossorigin="anonymous">
  mathjax:
    v3: false
    enable:
    js: https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.6/MathJax.js?config=TeX-AMS-MML_HTMLorMML
  mermaid:
    enable:
    style_optimization: false
    js: https://jsd.dusays.com/npm/mermaid@11/dist/mermaid.min.js
    theme: neutral
  copycode:
    enable: true
    default_text: 'Copy'
    success_text: 'Copied'
    toast: 复制成功
  heti:
    enable: false
    css: https://jsd.dusays.com/npm/heti@0.9/umd/heti.min.css
    js: https://jsd.dusays.com/npm/heti@0.9/umd/heti-addon.min.js
style:
  prefers_theme: auto
  font-size:
    root: 16px
    body: 17px
    code: 85%
    codeblock: 0.8125rem
  font-family:
    body: 'system-ui, "Microsoft Yahei", "Segoe UI", Arial, sans-serif'
    code: 'Menlo, Monaco, Consolas, system-ui, monospace, sans-serif'
    codeblock: 'Menlo, Monaco, Consolas, system-ui, monospace, sans-serif'
  text-align: left
  prefix:
    h2: https://api.iconify.design/ci:heading-h2.svg
  border-radius:
    card-l: 24px
    card: 16px
    card-s: 12px
    bar: 12px
    image-l: 24px
    image: 16px
    image-s: 8px
  corner-shape: superellipse(1.5)
  color:
    theme: 'hsl(192 98% 55%)'
    accent: 'hsl(14 100% 57%)'
    link: 'hsl(207 90% 54%)'
  animated_avatar:
    animate: auto
  codeblock:
    scrollbar: 4px
    highlightjs_theme: https://jsd.dusays.com/gh/highlightjs/cdn-release@11.9/build/styles/atom-one-dark.min.css
  loading:
    loading: 正在加载
    error: 加载失败，请稍后重试。
  gradient:
    start: 'linear-gradient(to right, hsl(215, 95%, 64%), hsl(195, 95%, 60%), hsl(165, 95%, 56%), hsl(165, 95%, 56%), hsl(195 95% 60%), hsl(215, 95%, 64%))'
    searchbar: 'linear-gradient(to right, #04f3ff, #08ffc6, #ddf730, #ffbd19, #ff1fe0, #c418ff, #3b5bff, #04f3ff)'
    avatar: 'conic-gradient(from 0deg, #04f3ff, #08ffc6, #ddf730, #ffbd19, #ff1fe0, #c418ff, #3b5bff, #04f3ff)'
    angle: 210deg
  leftbar:
    ui-style: card
    background-color-light: var(--card)
    background-color-dark: var(--card)
    background-image: url(https://jsd.dusays.com/gh/cdn-x/placeholder@1.0.13/image/sidebar-bg1@small.jpg)
    blur-px: 100px
    blur-bg: var(--bg-a60)
    background-opacity: 0.8
  error_page: https://jsd.dusays.com/gh/cdn-x/placeholder@1.0.12/404/1c830bfcd517d.svg
  site:
    blur-px: 100px
    blur-bg: var(--bg-a75)
    blur-sat: 300%
  header_prefix:
    h2: '#'
    h3: '='
    h4: '|'
    h5: ':'
