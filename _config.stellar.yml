site_tree:
  home:
    leftbar: welcome, sylj, recent
    rightbar: sjtp, recent_comments, sffw, qbtc, ltgc, mmtg
    comments:
  index_blog:
    base_dir: blog
    menu_id: post
    leftbar: welcome, recent
    rightbar: qbtc, ltgc, mmtg
    nav_tabs:
  index_topic:
    base_dir: topic
    menu_id: post
  index_wiki:
    base_dir: wiki
    menu_id: wiki
    leftbar: related, recent
    rightbar:
    nav_tabs:
  post:
    menu_id: post
    leftbar: wezh, welcome, related, recent
    rightbar: ghrepo, toc, recent_comments, sffw, qbtc, ltgc, mmtg, sjtp
