# Stellar v2 site overrides.

preconnect:
  - https://gcore.jsdelivr.net
  - https://unpkg.com
  - https://cdn.jsdelivr.net
  - https://cdnjs.cloudflare.com
  - https://jsd.dusays.com

topbar:
  enabled: false
  brand:
    image:
      src: https://cdn.dusays.com/favicon.ico
      variant: avatar
    name: 杜老师说
    tagline: dusays.com
    href: /

leftbar:
  brand:
    style: compact # compact | regular
    image:
      src: https://cdn.dusays.com/favicon.ico
      variant: avatar
    name: 杜老师说
    tagline: dusays.com
    href: /
  menu:
    - id: post
      accent: '#1BCDFC'
      icon: default:documents
      title: 博客
      url: /
    - id: wiki
      accent: '#3DC550'
      icon: example:notebook
      title: 图床
      url: https://7bu.top/
    - id: explore
      accent: '#FA6400'
      icon: example:planet
      title: 开往
      url: https://www.travellings.cn/go.html
    - id: social
      accent: '#F44336'
      icon: example:chat
      title: 聊天
      url: https://chat.dusays.com/signup_user_complete/?id=pmsp46j6ji8xdpket1pohptpnr&md=link&sbr=fa
    - type: search
  footer:
    actions:
      - type: link
        icon: https://jsd.admincdn.com/npm/dusays@5.0.0/020-rss.svg
        title: RSS
        url: https://dusays.com/atom.xml
      - type: link
        icon: https://jsd.admincdn.com/npm/dusays@5.0.0/031-twitch.svg
        title: Unsplash
        url: https://a.dusays.com/
      - type: link
        icon: https://jsd.admincdn.com/npm/dusays@5.0.0/033-spotify.svg
        title: 站点地图
        url: https://dusays.com/baidusitemap.xml
      - type: spacer
      - type: dropdown
        icon: solar:sun-2-line-duotone
        title: 配色
        items:
          - type: button
            icon: solar:sun-2-line-duotone
            title: 浅色
            onclick: "setColorScheme('light')"
          - type: button
            icon: solar:moon-sleep-line-duotone
            title: 深色
            onclick: "setColorScheme('dark')"
          - type: button
            icon: solar:laptop-minimalistic-line-duotone
            title: 跟随系统
            onclick: "setColorScheme('auto')"
            # onclick: "setColorScheme(document.documentElement.dataset.theme === 'light' ? 'dark' : document.documentElement.dataset.theme === 'dark' ? 'auto' : 'light')"

profiles:
  home:
    active_menu: post
    leftbar:
      widgets:
        - welcome
        - sylj
        - recent
    rightbar:
      widgets:
        - sjtp
        - recent_comments
        - sffw
        - qbtc
        - ltgc
        - mmtg
    comments:
      enabled: false
  blog_index:
    path: /blog/
    active_menu: post
    leftbar:
      widgets:
        - welcome
        - recent
    rightbar:
      widgets:
        - qbtc
        - ltgc
        - mmtg
    listing_nav:
      enabled: true
      tabs: []
  topic:
    path: /topic/
    active_menu: post
  wiki_index:
    path: /wiki/
    active_menu: null
    leftbar:
      widgets:
        - related
        - recent
    rightbar:
      widgets: []
    listing_nav:
      enabled: true
      tabs: []
  post:
    active_menu: post
    leftbar:
      widgets:
        - wezh
        - welcome
        - related
        - recent
    rightbar:
      widgets:
        - ghrepo
        - toc
        - recent_comments
        - sffw
        - qbtc
        - ltgc
        - mmtg
        - sjtp
  wiki:
    active_menu: null
    leftbar:
      widgets:
        - tree
        - related
        - recent
    rightbar:
      widgets:
        - ghrepo
        - toc
  notebooks:
    path: /notebooks/
    active_menu: null
    leftbar:
      widgets:
        - recent
    rightbar:
      widgets: []
  notebook:
    active_menu: null
    leftbar:
      widgets:
        - tagtree
        - recent
    rightbar:
      widgets: []
    listing:
      excerpt_length: 128
      per_page: null
      sort:
        field: updated
        direction: desc
    tag_icons: {}
  note:
    active_menu: null
    leftbar:
      widgets:
        - tagtree
        - recent
    rightbar:
      widgets:
        - toc
  author:
    path: /author/
    active_menu: post
    leftbar:
      widgets:
        - recent
        - timeline
    rightbar:
      widgets:
        - timeline
  error:
    path: /404.html
    image: https://jsd.dusays.com/npm/dusays/404.svg
    active_menu: post
    comments:
      enabled: false
    leftbar:
      widgets:
        - wezh
        - welcome
        - recent
    rightbar:
      widgets:
        - qbtc
        - ltgc
        - mmtg
  page:
    leftbar:
      widgets:
        - recent
    rightbar:
      widgets:
        - toc

article:
  style: tech
  paragraph_indent: auto
  listing:
    pinned_layout: flat
    card_layout: hero
    cover_ratio: 2
    excerpt_length: 128
    show_tags: false
  category_colors:
    探索号: '#f44336'
  banner:
    ratio: 2.5
  show_reading_time: false
  related_posts_limit: 0
  footer:
    license: '本文采用 [署名-非商业性使用-相同方式共享 4.0 国际](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-hans) 许可协议，转载请注明出处。</br><iframe src="https://cdn.dusays.com/drinks/" style="overflow-x:hidden;overflow-y:hidden; border:0xp none #fff; min-height:240px; width:100%;" frameborder="0" scrolling="no"></iframe>'
    share: []
    show_tags: true

appearance:
  preset: card
  color_scheme: auto
  colors:
    primary: 'hsl(192 98% 55%)'
    accent: 'hsl(14 100% 57%)'
    link: 'hsl(207 90% 54%)'
  gradients:
    primary_action: 'linear-gradient(to right, hsl(215, 95%, 64%), hsl(195, 95%, 60%), hsl(165, 95%, 56%), hsl(165, 95%, 56%), hsl(195 95% 60%), hsl(215, 95%, 64%))'
    search_bar: 'linear-gradient(to right, #04f3ff, #08ffc6, #ddf730, #ffbd19, #ff1fe0, #c418ff, #3b5bff, #04f3ff)'
  typography:
    font_family:
      body: 'system-ui, "Microsoft Yahei", "Segoe UI", Arial, sans-serif'
      code: 'Menlo, Monaco, Consolas, system-ui, monospace, sans-serif'
    font_size:
      root: 16px
      inline_code: 85%
      code_block: 0.8125rem
    content_align: left
    heading_prefixes:
      h2: '#'
      h3: '='
      h4: '|'
      h5: ':'
  shape:
    corner: superellipse(1.25)
    radius:
      card_large: 24px
      card: 16px
      card_small: 12px
      bar: 12px
      image_large: 24px
      image: 16px
      image_small: 8px
  code_block:
    scrollbar_width: 4px
    highlight_stylesheet: https://jsd.dusays.com/gh/highlightjs/cdn-release@11.9/build/styles/atom-one-dark.min.css

search:
  provider: local
  local:
    scope: all
    include_content: true
    cache_ttl_seconds: 86400

comments:
  provider: artalk
  title: 快来参与讨论吧~
  beaudar:
    repo: xxx/xxx
    issue-term: pathname
    issue-number: null
    theme: preferred-color-scheme
    label: null
    input-position: top
    comment-order: desc
    keep-theme: null
    loading: false
    branch: main
  utterances:
    repo: xxx/xxx
    issue-term: pathname
    issue-number: null
    theme: preferred-color-scheme
    label: null
  giscus:
    data-repo: xxx/xxx
    data-repo-id: null
    data-category: null
    data-category-id: null
    data-mapping: pathname
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: top
    data-theme: preferred_color_scheme
    data-lang: zh-CN
    data-loading: null
    crossorigin: anonymous
  twikoo:
    envId: https://xxx
  waline:
    serverURL: https://waline.vercel.app
    commentCount: true
    pageview: false
  artalk:
    server: https://artalk.dusays.com
    css: https://jsd.dusays.com/npm/artalk@2.10.0/dist/Artalk.min.css
    js: https://jsd.dusays.com/npm/artalk@2.10.0/dist/Artalk.min.js
    site: 杜老师说
    darkMode: auto
    imageUploader:
      api: https://7bu.top/api/v1/upload
      token: 'Bearer 198|G3L9heu8LimK9YSaQzFwqGlfv6EhYTHVIOIcGzUX'
      resp: data.links.url

tags:
  note:
    default_color: ''
    border: true
  checkbox:
    interactive: false
  quot:
    default:
      prefix: quot:quote-left
      suffix: quot:quote-right
    hashtag:
      prefix: quot:hashtag
      suffix: null
    question:
      prefix: quot:question
      suffix: null
  emoji:
    default_source: qq
    sources:
      twemoji: https://jsd.dusays.com/gh/twitter/twemoji/assets/svg/{name}.svg
      qq: https://jsd.dusays.com/gh/cdn-x/emoticons@3.1/qq/{name}.gif
      aru: https://jsd.dusays.com/gh/cdn-x/emoticons@3.1/aru/{name}.gif
      tieba: https://jsd.dusays.com/gh/cdn-x/emoticons@3.1/tieba/{name}.png
      blobcat: https://jsd.dusays.com/gh/cdn-x/emoticons@3.1/blobcat/{name}.gif
  icon:
    default_color: accent
  button:
    default_color: theme
  mark:
    default_color: yellow
  hashtag:
    default_color: null
  gallery:
    size: mix
    aspect_ratio: square

features:
  image_optimization:
    enabled: false
  color_scheme_switch:
    enabled: true
  lazy_loading:
    transition: fade
    auto_aspect_ratio: true
  lightbox:
    enabled: true
    selector: '.timenode p>img'
  link_prefetch:
    enabled: true
  reveal:
    enabled: true
  card_hover:
    # 控制是否启用鼠标跟随光照。
    spotlight: false
    # 控制是否启用 3D 倾斜。
    tilt: false
  heti:
    enabled: false
  math:
    provider: null
    katex: {}
    mathjax: {}
  diagrams:
    provider: null
    mermaid:
      theme: neutral

services:
  site_info:
    provider: null
  rating:
    provider: star_vote
    star_vote:
      endpoint: https://star-vote.xaox.cc/api/rating
  vote:
    provider: star_vote
    star_vote:
      endpoint: https://star-vote.xaox.cc/api/vote
  contributors:
    provider: github
    github:
      repositories:
        - source_prefix: wiki/stellar/
          repository: xaoxuu/hexo-theme-stellar-docs
          branch: main
  github_card:
    provider: github_readme_stats
    github_readme_stats:
      endpoint: https://github-readme-stats.vercel.app
  github:
    api_url: https://api.github.com
    raw_url: https://raw.githubusercontent.com
    gist_url: https://gist.github.com

fallbacks:
  avatar: https://jsd.dusays.com/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
  link_card: https://jsd.dusays.com/gh/cdn-x/placeholder@1.0.12/link/8f277b4ee0ecd.svg
  cover: https://jsd.dusays.com/gh/cdn-x/placeholder@1.0.12/cover/76b86c0226ffd.svg

canonical:
  host: null
  allowed_hosts:
    - localhost

open_graph:
  enabled: true
  twitter_id: null

structured_data:
  same_as: []

