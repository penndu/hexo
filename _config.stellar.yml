    menu_id: post
  wiki:
    menu_id: wiki
    leftbar: tree, related, recent
    rightbar: ghrepo, toc
  notebooks:
    base_dir: notebooks
    menu_id: notebooks
    leftbar: recent
    rightbar: null
  notes:
    menu_id: notebooks
    leftbar: tagtree, recent
    rightbar: null
  note:
    leftbar: tagtree, recent
    rightbar: toc
  author:
    base_dir: author
    menu_id: post
    leftbar: recent, timeline
    rightbar: timeline
  error_page:
    menu_id: post
    '404': '/404.html'
    leftbar: recent, timeline
    rightbar: timeline
  page:
    leftbar: recent
    rightbar: toc
